services:
  - type: web
    name: wiki-forge
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    startCommand: bash bin/render-start.sh
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: WIKIFORGE_LOG_LEVEL
        value: info
      - key: WIKIFORGE_STATE_BACKEND
        value: file
      - key: WIKIFORGE_STATE_DIR
        value: /app/.wiki-forge/state
      - key: WIKIFORGE_USER_STORE_FILE
        value: .wiki-forge/users.json
      - key: WIKIFORGE_SESSION_TTL_MS
        value: "28800000"
      - key: WIKIFORGE_ADMIN_USERNAME
        value: admin
      - key: WIKIFORGE_ADMIN_PASSWORD
        sync: false

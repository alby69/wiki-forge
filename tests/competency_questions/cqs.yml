competency_questions:
  - id: CQ01
    question: "Quali note supportano una data nota e chi ne è l'autore?"
    query: |
      PREFIX wf: <https://w3id.org/wikiforge/ontology/>
      PREFIX prov: <http://www.w3.org/ns/prov#>
      PREFIX dcterms: <http://purl.org/dc/terms/>
      PREFIX foaf: <http://xmlns.com/foaf/0.1/>
      SELECT ?supporterTitle ?authorName WHERE {
        ?supporterNote wf:supports ?targetNote ;
                       dcterms:title ?supporterTitle ;
                       prov:wasAttributedTo ?author .
        ?author foaf:name ?authorName .
      }
    expected_min_results: 1

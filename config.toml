# Project configuration for the LLM Wiki template.
#
# This is the single "knob" that turns the generic template into YOUR wiki.
# Edit the values below to adapt the project to any subject/context.
# Everything is plain text and key = "value"; no programming knowledge required.
#
# The conversion script (conv2md.py) and the agent schema (AGENT.md) both read
# this file. If the file is missing, safe defaults are used.

[project]
# Short internal name (used for logs / Docker image). Lowercase, no spaces.
name = "thesis-wiki"
# Human-friendly title shown in generated documents and the wiki index.
title = "Thesis Knowledge Base"
# Free-form description of the subject / context. The agent reads this to
# understand what kind of knowledge it is compiling.
context = "Master's thesis on AI and the transformation of work: sources span anthropology of labor (Graeber), nature of machine learning (Cristianini), AI impact and governance (Amodei, Karpathy), and organizational/HR practice (Gatti)."
# Language of the generated wiki content, e.g. "en", "it".
language = "en"

[paths]
# Folder with your ORIGINAL files (PDF, EPUB, DOCX, MD, TXT). Never modified.
sources = "backup"
# Folder where converted Markdown lives (the agent's inbox).
raw = "raw"
# Folder where the LLM writes the compiled, interlinked wiki.
wiki = "wiki"
# Folder for ephemeral query results / reports. Safe to delete.
output = "output"
# Folder for quick scratchpad notes prior to compilation into full wiki articles.
notes = "notes"
# Folder containing standard article templates.
templates = "templates"

[conversion]
# Set to true if your PDFs are scans (photos of pages) and you have an OCR
# layer available. Usually leave false for native-text PDFs.
ocr = false

# Agent behavior settings (read by the Web UI agent / note-taking workflows).
# NOTE: the Web UI server reads the LLM & CLI wiring from [agent.llm] below,
# not from this section.
[agent]
confirm_destructive = true

# LLM wiring used by the Web UI agent server (src/server/llmClient.ts).
[agent.llm]
provider = "opencode"        # opencode | anthropic | openai_compatible | ollama
# Path to the opencode CLI. Leave empty ("") for auto-detection: on every server
# start the program resolves `opencode` (PATH first, then ~/.opencode/bin and
# other well-known install locations) and writes the absolute path here.
opencode_command = ""
# Valid opencode flags only. `--non-interactive` is NOT a valid flag and makes
# opencode print its help text instead of answering. `--format json` lets the
# server extract a clean answer from the JSON event stream.
opencode_args = ["run", "--format", "json"]
api_base_url = ""
api_key_env = "WIKIFORGE_LLM_API_KEY"
# Used only by HTTP providers (anthropic / openai_compatible / ollama).
# For the "opencode" provider the model is resolved by the opencode CLI itself.
model = "claude-sonnet-4-6"
max_tokens = 4096
timeout_seconds = 60

# Naming conventions
[naming]
article_case = "kebab-case"
wiki_folder_case = "kebab-case"
forbidden_chars = [" ", "_", "/", "\\", ":", "*", "?", "\"", "<", ">", "|"]

# Export settings
[export]
formats = ["json", "html"]
include_raw = false
include_sources = false

# Web clipping
[webclip]
enabled = false
folder = "sources/web-clips"
format = "markdown"

# Optional audio / podcast synthesis configuration
[audio]
provider = "none"            # Options: "none" | "local" | "openai_tts" | "elevenlabs"
voice_host_a = "alloy"
voice_host_b = "echo"
output_folder = "output/audio"

# Internationalization / Multi-language settings
[i18n]
default_language = "en"
supported_languages = ["en", "it", "es", "fr", "de"]
fallback_language = "en"

# Tag vocabulary (controlled taxonomy) for the knowledge base.
#
# The agent draws tags from `allowed` when compiling notes, and `suggest_tags.py`
# ranks/limits suggestions to this list. Use namespaced tags (`topic/ai`,
# `author/karpathy`, `type/paper`) so the UI groups them into a coloured,
# hierarchical tag cloud. Keep `blocked` for noise words never to be suggested.
[tags]
allowed = [
  "topic/ai",
  "topic/economics",
  "topic/hr",
  "topic/anthropology",
  "type/paper",
  "type/essay",
  "type/book",
  "author/karpathy",
  "author/amodei",
  "author/graeber",
  "author/cristianini",
  "author/gatti",
  "status/draft",
  "status/review",
]
blocked = ["the", "and", "of", "a", "to", "in", "on", "for", "is", "are"]

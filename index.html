<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki-Forge UI</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #121316;
      }
      #app {
        height: 100vh;
      }
      .tree-folder:hover,
      .tree-file:hover {
        background: #232730;
      }
      .tree-file-active {
        background: #2d3748;
      }
      .tree-file-active:hover {
        background: #2d3748;
      }
      .markdown-body {
        color: #e2e8f0;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        color: #fff;
        line-height: 1.25;
        margin: 1.2em 0 0.6em;
        font-weight: 600;
      }
      .markdown-body h1 { font-size: 1.6em; border-bottom: 1px solid #2d3748; padding-bottom: 0.3em; }
      .markdown-body h2 { font-size: 1.35em; border-bottom: 1px solid #2d3748; padding-bottom: 0.25em; }
      .markdown-body h3 { font-size: 1.15em; }
      .markdown-body p { margin: 0.7em 0; }
      .markdown-body ul, .markdown-body ol { padding-left: 1.6em; margin: 0.6em 0; }
      .markdown-body li { margin: 0.25em 0; }
      .markdown-body a { color: #63b3ed; text-decoration: none; }
      .markdown-body a.wikilink {
        color: #90cdf4;
        background: #1e3a4d;
        padding: 0 4px;
        border-radius: 3px;
        border-bottom: 1px solid #2c5282;
      }
      .markdown-body a.wikilink:hover { background: #244a61; }
      .markdown-body code {
        background: #1a1b1e;
        border: 1px solid #2d3748;
        padding: 1px 5px;
        border-radius: 4px;
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 0.88em;
        color: #f6ad55;
      }
      .markdown-body pre {
        background: #1a1b1e;
        border: 1px solid #2d3748;
        padding: 12px 14px;
        border-radius: 6px;
        overflow-x: auto;
      }
      .markdown-body pre code { background: none; border: none; padding: 0; color: #e2e8f0; }
      .markdown-body blockquote {
        border-left: 3px solid #4299e1;
        margin: 0.8em 0;
        padding: 0.2em 1em;
        color: #a0aec0;
        background: #1a1d23;
      }
      .markdown-body table { border-collapse: collapse; margin: 0.8em 0; width: 100%; }
      .markdown-body th, .markdown-body td { border: 1px solid #2d3748; padding: 6px 10px; text-align: left; }
      .markdown-body th { background: #1a1b1e; }
      .markdown-body hr { border: none; border-top: 1px solid #2d3748; margin: 1.2em 0; }
      .markdown-body img { max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>

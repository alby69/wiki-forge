[project]
name = "thesis-wiki"
title = "Thesis Knowledge Base"
context = "Master's thesis on AI and the transformation of work: sources span anthropology of labor (Graeber), nature of machine learning (Cristianini), AI impact and governance (Amodei, Karpathy), and organizational/HR practice (Gatti)."
language = "en"

[paths]
sources = "backup"
raw = "raw"
wiki = "wiki"
output = "output"
notes = "notes"
templates = "templates"

[conversion]
ocr = false

[agent]
confirm_destructive = true

[agent.llm]
provider = "opencode"
opencode_command = ""
opencode_args = [ "run", "--format", "json" ]
api_base_url = ""
api_key_env = "WIKIFORGE_LLM_API_KEY"
model = "claude-sonnet-4-6"
max_tokens = 4096
timeout_seconds = 600

[llm.local]
# CPU-only SLM reasoning provider. llama-cpp-python is imported lazily: the
# model is never loaded when enabled = false.
enabled = true
model_path = "./models/deepseek-r1-distill-qwen-1.5b-q4_k_m.gguf"
n_ctx = 8192
n_threads = 8
n_batch = 512
n_gpu_layers = 0       # FORZATO A 0: esecuzione solo CPU
temperature = 0.2

[naming]
article_case = "kebab-case"
wiki_folder_case = "kebab-case"
forbidden_chars = [ " ", "_", "/", "\\", ":", "*", "?", "\"", "<", ">", "|" ]

[export]
formats = [ "json", "html" ]
include_raw = false
include_sources = false

[webclip]
enabled = false
folder = "sources/web-clips"
format = "markdown"

[audio]
provider = "none"
voice_host_a = "alloy"
voice_host_b = "echo"
output_folder = "output/audio"

[i18n]
default_language = "en"
supported_languages = [ "en", "it", "es", "fr", "de" ]
fallback_language = "en"

[okf]
version = "0.2"
type_vocabulary = [ "Concept", "Paper", "Book", "Tool", "Process", "Playbook", "Reference", "StudyGuide", "Quiz", "Attested Computation" ]

[okf.migration]
default_type = "Concept"

[[okf.migration.folder_type_map]]
folder = "intelligenza-artificiale"
type = "Concept"

[[okf.migration.folder_type_map]]
folder = "antropologia-economica"
type = "Concept"

[[okf.migration.folder_type_map]]
folder = "papers"
type = "Paper"

[[okf.migration.folder_type_map]]
folder = "tools"
type = "Tool"

[[okf.migration.folder_type_map]]
folder = "processes"
type = "Process"

[[okf.migration.folder_type_map]]
folder = "playbooks"
type = "Playbook"

[tags]
allowed = [ "topic/ai", "topic/economics", "topic/hr", "topic/anthropology", "type/paper", "type/essay", "type/book", "author/karpathy", "author/amodei", "author/graeber", "author/cristianini", "author/gatti", "status/draft", "status/review" ]
blocked = [ "the", "and", "of", "a", "to", "in", "on", "for", "is", "are" ]

[versioning]
enabled = true
fields = [ "version", "parent_commit", "generated" ]

[autonomy]
mode = "off"
scripts = [ "orphan_repair", "graph_analytics", "okf_lint" ]
paths = [ "wiki" ]
findingKinds = [ "orphan_node", "inconsistency" ]
revalidation = [ "okf_lint", "shacl", "cq_validator" ]

[enterprise]
enable_rbac = false
cloud_backup_webdav = ""

# B2/B3/B6 — catalogo ruoli e ACL: `enable_rbac = true` attiva il gate B3
# sul bus; l'identity provider resta opzionale e richiede `auth.provider`.
[enterprise.roles]
Reader = [ "wiki.read", "export.read" ]
Contributor = [ "note.write", "changeset.stage", "upload.write" ]
KnowledgeEngineer = [ "verify.write", "usecase.run", "script.run", "schedule.write" ]
Admin = [ "project.write", "approval.decide", "config.write" ]

[enterprise.projectAcls]
default = [ "Reader", "Contributor", "KnowledgeEngineer", "Admin" ]
tesi = [ "Reader", "Contributor", "KnowledgeEngineer", "Admin" ]
wikiforge = [ "Reader", "Contributor", "KnowledgeEngineer", "Admin" ]

# B6 — adapter IdP opzionale: valorizzare solo con enable_rbac = true.
# `provider` vuoto = legacy; "oidc" | "saml" | "oauth2" attiva l'adapter.
# Nessuna connessione viene aperta a startup: JWKS/metadata/token sono
# risolti lazily al primo Bearer token verificato.
# [enterprise.auth]
# provider = "oidc"
# issuer = "https://idp.example.com"
# audience = "wiki-forge"
# jwksUrl = "https://idp.example.com/.well-known/jwks.json"
# samlMetadataUrl = "https://idp.example.com/saml/metadata"
# clientId = ""
# authorizationUrl = "https://idp.example.com/authorize"
# tokenUrl = "https://idp.example.com/token"
# actorClaim = "sub"
# rolesClaim = "roles"
# [enterprise.auth.roleMap]
# "wf-admin" = "Admin"

# C0: dichiarazione inerte. Nessun codice apre una connessione a startup;
# `passwordEnv` indica la variabile d'ambiente che conterrà la password.
[neo4j]
enabled = false
uri = "bolt://localhost:7687"
user = "neo4j"
passwordEnv = "NEO4J_PASSWORD"
database = "neo4j"
tls = false

# Un deployment con una sola database puo' mappare tutti i progetti allo stesso
# nome e affidare l'isolamento alle label `wf:project` (verra' in C2).
[neo4j.projects]
default = "neo4j"
tesi = "tesi"
wikiforge = "wikiforge"

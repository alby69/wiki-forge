# Agenti schedulati per il KE Workbench (F1: validazione, F2/F3: esecuzione,
# F5: policy LLM consultiva, F6: trigger da eventi con approvazione umana).
# S1: i job script generati dalla UI stanno in config/script_schedules.toml e
# vengono uniti qui dal parser; qui restano i 9 job Use Case originali.
# Gli orari sono stati confermati; tutti i job hanno auto_apply = false.
# I job cron non toccano la wiki: scrivono solo in output/ o in docs/METRICS.md.
# F5/F6: ogni decisione è registrata con rationale e fonti in
# output/scheduler/decisions.jsonl; gli step mutanti non vengono mai eseguiti
# automaticamente, ma accodati in .wiki-forge/scheduler-approvals.json.

# Il Policy Agent è consultivo e fail-closed: se l'LLM non è disponibile o
# restituisce una risposta non valida, vale la regola deterministica
# "sola lettura + approvazione umana" e la decisione viene comunque loggata.
[agent.policy]
enabled = true

[agent.scheduler]
enabled = true
timezone = "Europe/Rome"
max_concurrency = 1
default_timeout_seconds = 900
log_dir = "output/scheduler"

[[agent.scheduler.jobs]]
id = "nightly-validation"
role = "Ontology Guardian"
use_case = "ke_ontological_validation"
schedule = "0 2 * * *"
enabled = true
project = "default"
args = { wiki_dir = "wiki" }
auto_apply = false
max_retries = 2

[[agent.scheduler.jobs]]
id = "daily-cq-coverage"
role = "Knowledge Auditor"
use_case = "ke_cq_assessment"
schedule = "20 2 * * *"
enabled = true
project = "default"
auto_apply = false
max_retries = 1

[[agent.scheduler.jobs]]
id = "weekly-neuro-symbolic"
role = "Pattern Reasoner"
use_case = "ke_neuro_symbolic"
schedule = "0 3 * * 0"
enabled = true
project = "default"
auto_apply = false
max_retries = 1

# Solo lo step 1 (export_semantic): okf_reindex riscrive wiki/index.md.
[[agent.scheduler.jobs]]
id = "weekly-rdf-export"
role = "Semantic Publisher"
use_case = "ke_semantic_export"
steps = [0]
schedule = "0 4 * * 0"
enabled = true
project = "default"
auto_apply = false
max_retries = 1

# Solo lo step 2 (ke_maturity -> output/): maturity_calculator scrive il frontmatter.
[[agent.scheduler.jobs]]
id = "monthly-maturity"
role = "Governance Analyst"
use_case = "ke_maturity_eval"
steps = [1]
schedule = "0 3 1 * *"
enabled = true
project = "default"
auto_apply = false
max_retries = 1

# UC1 resta manuale di default: gli step di inferenza/lint sono in sola lettura.
[[agent.scheduler.jobs]]
id = "weekly-schema-review"
role = "Schema Modeler"
use_case = "ke_schema_modeling"
steps = [0, 1]
schedule = "30 4 * * 0"
enabled = false
project = "default"
auto_apply = false
max_retries = 1

# F6 — trigger da evento "nuova nota": dopo 5 minuti di quiete viene eseguito
# lo step 0 (schema_infer, sola lettura). Lo step 2 (suggest_tags) scrive il
# frontmatter: il Policy Agent lo sottrae all'esecuzione e lo accoda per
# l'approvazione umana nel Workbench. Disabilitato di default: abilitarlo con
# PATCH /api/ke/schedule/note-created-review {"enabled": true}. Il webhook
# POST /api/ke/schedule/trigger accoda solo i job abilitati.
[[agent.scheduler.jobs]]
id = "note-created-review"
role = "Schema Modeler"
use_case = "ke_schema_modeling"
steps = [0, 2]
schedule = "30 4 * * 0"
event_trigger = "note.created"
debounce_seconds = 300
enabled = false
project = "default"
auto_apply = false
max_retries = 1

# Fase 75 — rilevamento e riparazione del drift tra docs/ e la wiki di wiki-forge.
# Lo step rigenera la proiezione OKF nella wiki (le note curate sono preservate).
# I percorsi relativi sono risolti rispetto alla radice del repository. Essendo
# mutante, il Policy Agent F5 lo sottrae e lo accoda per l'approvazione F6.
# Ogni decisione riporta rationale e fonti in output/scheduler/decisions.jsonl.
[[agent.scheduler.jobs]]
id = "weekly-docs-wiki-drift"
role = "Documentation Auditor"
use_case = "ke_docs_wiki_drift"
steps = [0]
schedule = "0 6 * * 1"
enabled = true
project = "default"
args = { docs_dir = "docs", wiki_dir = "projects/wikiforge/wiki" }
auto_apply = false
max_retries = 1

# Fase 76 — ponte wiki -> modifiche al programma. Lo step 0 (propose) è in
# sola lettura e accoda la proposta; lo step 1 (apply) è mutante e viene
# sempre sottratto dal Policy Agent F5, accodato per l'approvazione F6 e
# applicato solo da POST /api/ke/schedule/approvals/:id/approve. Disabilitato
# di default: va innescato a mano con una proposta già presente.
[[agent.scheduler.jobs]]
id = "wiki-program-change"
role = "Documentation Auditor"
use_case = "ke_wiki_program_change"
steps = [0, 1]
schedule = "0 7 * * 1"
enabled = false
project = "wikiforge"
args = { proposal = "output/program-changes/proposal.json", stage_dir = "output/program-changes" }
auto_apply = false
max_retries = 1

name: CI Test Suite

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test conv2md CLI
        run: python scripts/conv2md.py --help

      - name: Test wiki_stats
        run: python scripts/wiki_stats.py

      - name: Test clip2md CLI
        run: python scripts/clip2md.py --help

      - name: Test docs-sync consistency
        run: python scripts/check_docs_sync.py

      - name: Run Python coverage gates
        run: |
          npm run test:coverage
          npm run test:coverage:semantics

      - name: Run Playwright E2E flow
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-py${{ matrix.python-version }}
          path: playwright-report
          if-no-files-found: ignore

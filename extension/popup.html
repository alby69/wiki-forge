<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wiki-Forge Clipper</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #0369a1;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #38bdf8;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>🌐 Wiki-Forge Clipper</h2>

  <div class="form-group">
    <label for="serverUrl">Server API URL</label>
    <input type="text" id="serverUrl" value="http://127.0.0.1:3001">
  </div>

  <div class="form-group">
    <label for="apiToken">API Token (Optional)</label>
    <input type="password" id="apiToken" placeholder="X-WikiForge-Token">
  </div>

  <div class="form-group">
    <label for="projectId">Target Workspace/Project</label>
    <select id="projectId">
      <option value="default">Default Wiki</option>
    </select>
  </div>

  <button id="clipBtn">✂️ Clip Page to Wiki</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>

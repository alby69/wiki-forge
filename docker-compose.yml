# docker-compose.yml — reproducible environment, no local Python/Node install.
#
# Common commands (run from the project root):
#   docker compose build                    # build both images
#   docker compose run --rm wiki convert    # convert sources -> raw/
#   docker compose run --rm wiki shell      # open a shell inside the env
#   docker compose up                       # run API + UI (Web UI at http://localhost:5173, API at http://localhost:3001)
#   docker compose down                     # stop and remove containers/networks
#
# The project name is "wiki-forge" (overrides the folder name), so containers
# and networks are prefixed with `wiki-forge_` instead of `tesi_`.
# The current directory is mounted at /wiki (converter) and /app (UI/API) so all
# generated files (raw/, wiki/, output/) are written back to your machine.
name: wiki-forge

services:
  wiki:
    image: ghcr.io/alby69/wiki-forge:latest
    build: .
    volumes:
      - .:/wiki
    working_dir: /wiki
    command: ["shell"]

  api:
    image: ghcr.io/alby69/wiki-forge-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    volumes:
      - .:/app
      - /app/node_modules
      - ${HOME}/.opencode/bin/opencode:/root/.opencode/bin/opencode:ro
      - ${HOME}/.config/opencode:/root/.config/opencode
      - ${HOME}/.local/share/opencode:/root/.local/share/opencode
    environment:
      - OPENCODE_BIN=/root/.opencode/bin/opencode
      - PORT=3001
    working_dir: /app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npx tsx src/server/httpServer.ts"

  ui:
    image: ghcr.io/alby69/wiki-forge-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    volumes:
      - .:/app
      - /app/node_modules
      - ${HOME}/.opencode/bin/opencode:/root/.opencode/bin/opencode:ro
      - ${HOME}/.config/opencode:/root/.config/opencode
      - ${HOME}/.local/share/opencode:/root/.local/share/opencode
    environment:
      - OPENCODE_BIN=/root/.opencode/bin/opencode
      - VITE_API_BASE_URL=http://api:3001
    working_dir: /app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

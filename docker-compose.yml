# docker-compose.yml — reproducible environment, no local Python/Node install.
#
# Common commands (run from the project root):
#   docker compose build                    # build both images
#   docker compose run --rm wiki convert    # convert sources -> raw/
#   docker compose run --rm wiki shell      # open a shell inside the env
#   docker compose up                       # run API + UI
#   docker compose down                     # stop and remove containers

name: wiki-forge

services:
  wiki:
    image: ghcr.io/alby69/wiki-forge:latest
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/wiki
    working_dir: /wiki
    command: ["shell"]

  # A2/A3: the Python domain API is a standalone service, not a Vite plugin
  # and not an in-process library inside the Node gateway.
  kg-api:
    image: ghcr.io/alby69/wiki-forge:latest
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/wiki
    working_dir: /wiki
    # Internal only: all browser traffic goes through the Node gateway proxy
    # (/api/v1/graph/*), keeping one public API surface.
    expose:
      - "8000"
    command: ["python3", "-m", "uvicorn", "src.backend.wikiforge.api.api_server:app", "--host", "0.0.0.0", "--port", "8000"]

  api:
    image: ghcr.io/alby69/wiki-forge-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - OPENCODE_BIN=/usr/local/bin/opencode
      - PORT=3001
      # Compose DNS name of the standalone FastAPI service. The Node gateway
      # proxies /api/v1/graph/* here instead of expecting localhost:8000.
      - FASTAPI_SERVER_URL=http://kg-api:8000
      - WIKIFORGE_EMBED_SCHEDULER=false
    working_dir: /app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npx tsx watch src/backend/server/httpServer.ts"
    depends_on:
      - kg-api

  ui:
    image: ghcr.io/alby69/wiki-forge-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - OPENCODE_BIN=/usr/local/bin/opencode
      # Browser-facing origin: from the user's browser 127.0.0.1:3001 is the
      # published host port of the `api` service below.
      - VITE_API_BASE_URL=http://127.0.0.1:3001
      # Dev-server proxy target: inside this container 127.0.0.1 is NOT the api
      # container, so the target must use the compose service name.
      - VITE_PROXY_TARGET=http://api:3001
    working_dir: /app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  worker:
    image: ghcr.io/alby69/wiki-forge-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - WIKIFORGE_STATE_BACKEND=${WIKIFORGE_STATE_BACKEND:-file}
      - WIKIFORGE_STATE_DIR=/app/.wiki-forge/state
      - WIKIFORGE_WORKER_CONCURRENCY=${WIKIFORGE_WORKER_CONCURRENCY:-2}
      - WIKIFORGE_WORKER_LEASE_MS=${WIKIFORGE_WORKER_LEASE_MS:-30000}
      - WIKIFORGE_WORKER_ID=${WIKIFORGE_WORKER_ID:-worker-compose}
    command: npm run worker
    depends_on:
      - kg-api

  mcp-server:
    image: ghcr.io/alby69/wiki-forge:latest
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/wiki
    working_dir: /wiki
    ports:
      - "8080:8080"
    command: ["npm", "run", "mcp", "--", "--http", "--port", "8080"]

# docker-compose.yml — reproducible environment, no local Python/Node install.
#
# Common commands (run from the project root):
#   docker compose build                    # build both images
#   docker compose run --rm wiki convert    # convert sources -> raw/
#   docker compose run --rm wiki shell      # open a shell inside the env
#   docker compose up                       # run API + UI
#   docker compose down                     # stop and remove containers

name: wiki-forge

services:
  wiki:
    image: ghcr.io/alby69/wiki-forge:latest
    build: .
    volumes:
      - .:/wiki
    working_dir: /wiki
    command: ["shell"]

  api:
    image: ghcr.io/alby69/wiki-forge-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - OPENCODE_BIN=/usr/local/bin/opencode
      - PORT=3001
    working_dir: /app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npx tsx watch src/server/httpServer.ts"

  ui:
    image: ghcr.io/alby69/wiki-forge-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.ui
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - OPENCODE_BIN=/usr/local/bin/opencode
      # Browser-facing origin: from the user's browser 127.0.0.1:3001 is the
      # published host port of the `api` service below.
      - VITE_API_BASE_URL=http://127.0.0.1:3001
      # Dev-server proxy target: inside this container 127.0.0.1 is NOT the api
      # container, so the target must use the compose service name.
      - VITE_PROXY_TARGET=http://api:3001
    working_dir: /app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  mcp-server:
    image: ghcr.io/alby69/wiki-forge:latest
    build: .
    volumes:
      - .:/wiki
    working_dir: /wiki
    ports:
      - "8080:8080"
    command: ["python3", "src/server/mcp_server.py", "--http", "--port", "8080"]
